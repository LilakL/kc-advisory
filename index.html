<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konrad Czachor | Executive Interim</title>

<style>
:root{
--primary:#0f2e4f;
--text:#111827;
--muted:#6b7280;
--bg:#f7f8fa;
--glass:rgba(255,255,255,.65);
}

body.dark{
--primary:#1e3a5f;
--text:#e5e7eb;
--muted:#9ca3af;
--bg:#0b1220;
--glass:rgba(15,23,42,.65);
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s ease;
line-height:1.6;
}

/* HEADER */

header{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 60px;
background:var(--glass);
backdrop-filter:blur(16px);
z-index:1000;
transition:.3s ease;
}

header.scrolled{padding:12px 60px;}

nav{
display:flex;
align-items:center;
gap:28px;
}

nav a{
text-decoration:none;
font-size:14px;
letter-spacing:.5px;
color:var(--text);
}

.lang button,.mode-toggle{
border:none;
background:none;
cursor:pointer;
font-size:13px;
color:var(--text);
opacity:.6;
}

.lang button.active{
opacity:1;
font-weight:600;
}

.mode-toggle{font-weight:600;opacity:1;}

/* HERO */

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero-logo{
height:420px;
transition:.4s cubic-bezier(.22,1,.36,1);
}

.hero-logo.shrink{height:160px;}

.hero h1{
margin-top:50px;
font-size:44px;
max-width:900px;
}

.hero p{
margin-top:20px;
font-size:20px;
color:var(--muted);
max-width:700px;
}

.cta{
margin-top:50px;
padding:15px 42px;
background:var(--primary);
color:#fff;
border-radius:40px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.cta:hover{transform:translateY(-3px);}

/* SECTION */

.section{
padding:160px 20px;
max-width:1100px;
margin:auto;
text-align:center;
}

.section h2{
font-size:34px;
margin-bottom:70px;
}

/* IMPACT */

.impact{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:60px;
margin-top:80px;
}

.impact-item{
flex:1;
min-width:220px;
}

.impact-item h3{
font-size:42px;
color:var(--primary);
margin-bottom:10px;
}

/* CLIENTS MARQUEE */

.clients{
margin-top:120px;
overflow:hidden;
position:relative;
}

.marquee{
display:flex;
gap:80px;
animation:scroll 25s linear infinite;
}

.marquee img{
height:60px;
opacity:.7;
transition:.3s;
}

.marquee img:hover{
opacity:1;
transform:scale(1.1);
}

@keyframes scroll{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

/* FADE */

.fade{
opacity:0;
transform:translateY(30px);
transition:.9s cubic-bezier(.22,1,.36,1);
}

.fade.visible{
opacity:1;
transform:translateY(0);
}

/* MOBILE */

@media(max-width:768px){
header{padding:15px 20px;}
.hero-logo{height:240px;}
.hero-logo.shrink{height:110px;}
.hero h1{font-size:28px;}
.impact{flex-direction:column;}
}
</style>
</head>

<body>

<header id="header">
<nav>
<a href="#services" data-i18n="nav_services">Services</a>
<a href="profile.html" data-i18n="nav_profile">Profile</a>
<a href="contact.html" data-i18n="nav_contact">Contact</a>

<div class="lang">
<button data-lang="en">EN</button>
<button data-lang="pl">PL</button>
<button data-lang="de">DE</button>
</div>

<button class="mode-toggle" id="modeToggle">Dark</button>
</nav>
</header>

<section class="hero">
<img src="img/logo.png" class="hero-logo" id="heroLogo">

<h1 data-i18n="hero_title"></h1>
<p data-i18n="hero_sub"></p>

<a href="contact.html" class="cta" data-i18n="hero_cta"></a>
</section>

<section class="section fade">
<h2 data-i18n="impact_title"></h2>

<div class="impact">
<div class="impact-item">
<h3 class="counter" data-target="25">0</h3>
<p data-i18n="impact1"></p>
</div>
<div class="impact-item">
<h3 class="counter" data-target="12">0</h3>
<p data-i18n="impact2"></p>
</div>
<div class="impact-item">
<h3>90</h3>
<p data-i18n="impact3"></p>
</div>
</div>
</section>

<section class="section clients fade">
<h2 data-i18n="clients_title"></h2>

<div class="marquee">
<img src="img/BMW.png">
<img src="img/Magna.jpg">
<img src="img/Nidec.png">
<img src="img/Delphi.png">
<img src="img/Garmin.png">

<!-- duplicated for smooth loop -->
<img src="img/BMW.png">
<img src="img/Magna.jpg">
<img src="img/Nidec.png">
<img src="img/Delphi.png">
<img src="img/Garmin.png">
</div>
</section>

<script>

/* Dark Mode */
const toggle=document.getElementById("modeToggle");
if(localStorage.getItem("mode")==="dark"){
document.body.classList.add("dark");
toggle.textContent="Light";
}
toggle.addEventListener("click",()=>{
document.body.classList.toggle("dark");
localStorage.setItem("mode",
document.body.classList.contains("dark")?"dark":"light");
});

/* Scroll Shrink */
const header=document.getElementById("header");
const heroLogo=document.getElementById("heroLogo");
window.addEventListener("scroll",()=>{
if(window.scrollY>100){
header.classList.add("scrolled");
heroLogo.classList.add("shrink");
}else{
header.classList.remove("scrolled");
heroLogo.classList.remove("shrink");
}
});

/* Counter */
const counters=document.querySelectorAll(".counter");
const counterObserver=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
const el=entry.target;
let target=+el.dataset.target;
let count=0;
let step=target/60;
function update(){
count+=step;
if(count<target){
el.innerText=Math.ceil(count);
requestAnimationFrame(update);
}else{
el.innerText=target+"+";
}
}
update();
counterObserver.unobserve(el);
}
});
},{threshold:.6});
counters.forEach(c=>counterObserver.observe(c));

/* Language */

const translations={
en:{
nav_services:"Services",
nav_profile:"Profile",
nav_contact:"Contact",
hero_title:"Executive Interim & Value Creation in Manufacturing",
hero_sub:"Operational stabilization and EBITDA protection for Private Equity and Automotive Tier 1–2.",
hero_cta:"Schedule Executive Discussion",
impact_title:"Selected Impact",
impact1:"Operational Projects",
impact2:"Plants Stabilized",
impact3:"Days Turnaround Framework",
clients_title:"Selected Clients"
},
pl:{
nav_services:"Usługi",
nav_profile:"Profil",
nav_contact:"Kontakt",
hero_title:"Executive Interim i Kreowanie Wartości",
hero_sub:"Stabilizacja operacyjna oraz ochrona EBITDA dla Private Equity i Automotive.",
hero_cta:"Umów Rozmowę",
impact_title:"Wybrane Realizacje",
impact1:"Projektów Operacyjnych",
impact2:"Ustabilizowanych Zakładów",
impact3:"Dni Modelu Turnaround",
clients_title:"Wybrani Klienci"
},
de:{
nav_services:"Leistungen",
nav_profile:"Profil",
nav_contact:"Kontakt",
hero_title:"Executive Interim & Wertsteigerung",
hero_sub:"Operative Stabilisierung und EBITDA-Sicherung für Private Equity.",
hero_cta:"Strategisches Gespräch",
impact_title:"Ausgewählte Projekte",
impact1:"Operative Projekte",
impact2:"Stabilisierte Werke",
impact3:"Tage Turnaround Modell",
clients_title:"Ausgewählte Kunden"
}
};

function setLanguage(lang){
localStorage.setItem("lang",lang);
document.querySelectorAll(".lang button").forEach(b=>{
b.classList.remove("active");
if(b.dataset.lang===lang) b.classList.add("active");
});
document.querySelectorAll("[data-i18n]").forEach(el=>{
el.textContent=translations[lang][el.dataset.i18n];
});
}

let savedLang=localStorage.getItem("lang");
if(!savedLang){
let browserLang=navigator.language.slice(0,2);
savedLang=translations[browserLang]?browserLang:"en";
}
setLanguage(savedLang);

document.querySelectorAll(".lang button").forEach(btn=>{
btn.addEventListener("click",()=>setLanguage(btn.dataset.lang));
});

/* Fade */
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){
entry.target.classList.add("visible");
}
});
},{threshold:.15});
document.querySelectorAll(".fade").forEach(el=>observer.observe(el));

</script>

</body>
</html>
