<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konrad Czachor Advisory & Partners</title>

<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial}

header{
position:sticky;top:0;background:#fff;padding:15px 40px;
display:flex;justify-content:space-between;align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);z-index:10
}

.logo img{height:50px}

nav a{margin:0 15px;text-decoration:none;color:#111;font-weight:600}

.lang button{
margin-left:6px;padding:8px 12px;border:1px solid #ccc;background:#fff;
border-radius:8px;font-size:20px;cursor:pointer;transition:.2s
}
.lang button.active{border-color:#2563eb;box-shadow:0 0 0 2px #2563eb inset}

.hero{
height:360px;background:url(img/background.jpg) center/cover;
display:flex;align-items:center;padding-left:60px;color:white
}
.hero h1{font-size:42px;margin:0}
.hero p{font-size:20px}

.tiles{
display:grid;grid-template-columns:repeat(4,1fr);
gap:25px;padding:70px
}
.tile{
height:220px;background-size:cover;background-position:center;
display:flex;align-items:center;justify-content:center;
text-decoration:none;transition:.3s
}
.tile:hover{transform:scale(1.03)}
.tile span{
color:#fff;font-size:22px;font-weight:600;
padding:10px 28px;border:2px solid #fff;border-radius:999px;
background:rgba(0,0,0,.35)
}

footer{background:#111;color:#fff;padding:25px;text-align:center}

.cta{
position:fixed;right:20px;bottom:20px;
background:#2563eb;color:white;padding:16px 30px;
border-radius:30px;font-weight:700;text-decoration:none;
animation:pulse 2s infinite
}
@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(37,99,235,.6)}
70%{box-shadow:0 0 0 20px rgba(37,99,235,0)}
100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}
}

@media(max-width:900px){
.tiles{grid-template-columns:1fr}
.hero{height:280px;padding:40px}
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="img/logo.png" alt="Konrad Czachor Advisory & Partners">
</div>

<nav>
<a href="#services" id="navServices"></a>
<a href="profile.html" id="navAbout"></a>
<a href="contact.html" id="navContact"></a>
</nav>

<div class="lang">
<button data-lang="pl">PL</button>
<button data-lang="en">GB</button>
<button data-lang="de">DE</button>
</div>
</header>

<section class="hero">
<div>
<h1>Konrad Czachor Advisory & Partners</h1>
<p id="heroSub"></p>
</div>
</section>

<div id="services" class="tiles">
<a class="tile" href="training.html" style="background-image:url(img/training.jpg)"><span id="t1"></span></a>
<a class="tile" href="audits.html" style="background-image:url(img/audits.jpg)"><span id="t2"></span></a>
<a class="tile" href="interim.html" style="background-image:url(img/interim.jpg)"><span id="t3"></span></a>
<a class="tile" href="b2b.html" style="background-image:url(img/b2b.jpg)"><span id="t4"></span></a>
</div>

<footer>© 2026 Konrad Czachor Advisory & Partners</footer>

<a class="cta" id="ctaBtn" href="contact.html"></a>

<script>
const dict={
pl:{nav:["Usługi","O mnie","Kontakt"],cta:"Rozpocznij transformację",hero:"Szkolenia • Audyty • Interim • B2B",t:["Szkolenia","Audyty","Interim","B2B"]},
en:{nav:["Services","About me","Contact"],cta:"Start your transformation",hero:"Trainings • Audits • Interim • B2B",t:["Trainings","Audits","Interim","B2B"]},
de:{nav:["Leistungen","Über mich","Kontakt"],cta:"Transformation starten",hero:"Schulungen • Audits • Interim • B2B",t:["Schulungen","Audits","Interim","B2B"]}
};

function setLang(l){
localStorage.setItem("lang",l);
document.querySelectorAll(".lang button").forEach(b=>b.classList.remove("active"));
document.querySelector(`[data-lang=${l}]`).classList.add("active");
heroSub.innerText=dict[l].hero;
[t1,t2,t3,t4].forEach((e,i)=>e.innerText=dict[l].t[i]);
navServices.innerText=dict[l].nav[0];
navAbout.innerText=dict[l].nav[1];
navContact.innerText=dict[l].nav[2];
ctaBtn.innerText=dict[l].cta;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
setLang(localStorage.getItem("lang")||"pl");
</script>

</body>
</html>
