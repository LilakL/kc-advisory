<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O mnie | Konrad Czachor Advisory & Partners</title>

<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial}

/* HEADER */
header{
position:sticky;
top:0;
background:#fff;
padding:25px 40px;
display:flex;
justify-content:space-between;
align-items:flex-start;
box-shadow:0 2px 10px rgba(0,0,0,.1);
z-index:10
}

.logo img{
height:140px;
display:block;
}

.right-menu{
display:flex;
flex-direction:column;
align-items:flex-end;
}

nav{margin-bottom:15px}

nav a{
margin-left:25px;
text-decoration:none;
color:#111;
font-weight:600;
font-size:18px;
}

.lang button{
margin-left:8px;
padding:8px 14px;
border:1px solid #ccc;
background:#fff;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.lang button.active{
border-color:#2563eb;
box-shadow:0 0 0 2px #2563eb inset;
}

/* HERO */
.hero{
height:300px;
background-size:cover;
background-position:center;
position:relative;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
}

.hero h1{
position:relative;
z-index:2;
font-size:42px;
margin:0;
}

/* PROFILE */
.profile{
padding:80px 40px;
background:#f4f4f4;
}

.profile-inner{
max-width:1100px;
margin:auto;
display:grid;
grid-template-columns:420px 1fr;
gap:70px;
align-items:center;
}

.profile-img img{
width:100%;
border-radius:16px;
box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.profile-text p{
font-size:18px;
line-height:1.7;
margin-bottom:24px;
}

footer{
background:#111;
color:#fff;
padding:25px;
text-align:center;
}

@media(max-width:900px){
.logo img{height:90px}
header{flex-direction:column;align-items:center}
.right-menu{align-items:center}
.profile-inner{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="logo">
<img id="siteLogo" alt="Konrad Czachor Advisory & Partners">
</div>

<div class="right-menu">
<nav>
<a href="index.html#services" id="navServices"></a>
<a href="profile.html" id="navAbout"></a>
<a href="contact.html" id="navContact"></a>
</nav>

<div class="lang">
<button data-lang="pl">PL</button>
<button data-lang="en">GB</button>
<button data-lang="de">DE</button>
</div>
</div>
</header>

<section id="heroSection" class="hero">
<h1 id="title"></h1>
</section>

<section class="profile">
<div class="profile-inner">

<div class="profile-img">
<img id="profileImage" alt="Konrad Czachor">
</div>

<div class="profile-text">
<p id="p1"></p>
<p id="p2"></p>
<p id="p3"></p>
<p id="p4"></p>
</div>

</div>
</section>

<footer>© 2026 Konrad Czachor Advisory & Partners</footer>

<script>

/* ===== AUTO BASE PATH ===== */
const BASE_PATH = window.location.origin;

/* ===== USTAWIENIE OBRAZÓW ===== */
function setImages(){
    document.getElementById("profileImage").src =
        BASE_PATH + "/img/Konrad-Czachor.jpg";

    document.getElementById("siteLogo").src =
        BASE_PATH + "/img/logo.png";

    document.getElementById("heroSection").style.backgroundImage =
        "url('" + BASE_PATH + "/img/background.jpg')";
}

/* ===== JĘZYKI ===== */
const dict={
pl:{
nav:["Usługi","O mnie","Kontakt"],
title:"O mnie",
text:[
"Od ponad 20 lat pracuję w środowisku przemysłowym i międzynarodowym.",
"Łączę doświadczenie operacyjne z praktycznym podejściem do zarządzania zmianą.",
"Specjalizuję się w transformacji operacyjnej, systemach jakości oraz budowaniu silnych struktur zarządczych.",
"Moim celem jest realny rezultat – wykonanie ponad prezentację."
]
},
en:{
nav:["Services","About me","Contact"],
title:"About me",
text:[
"I have over 20 years of experience in international industrial environments.",
"I combine operational leadership with practical change management.",
"My focus areas include operational transformation, quality systems and executive structures.",
"My objective is measurable impact – execution over theory."
]
},
de:{
nav:["Leistungen","Über mich","Kontakt"],
title:"Über mich",
text:[
"Seit über 20 Jahren arbeite ich im internationalen Industrieumfeld.",
"Ich verbinde operative Führung mit pragmatischem Change-Management.",
"Meine Schwerpunkte sind operative Transformation, Qualitätssysteme und Führungsstrukturen.",
"Mein Ziel ist messbarer Erfolg – Umsetzung statt Theorie."
]
}
};

function setLang(l){
localStorage.setItem("lang",l);

document.querySelectorAll(".lang button")
.forEach(b=>b.classList.remove("active"));

document.querySelector(`[data-lang=${l}]`)
.classList.add("active");

document.getElementById("navServices").innerText=dict[l].nav[0];
document.getElementById("navAbout").innerText=dict[l].nav[1];
document.getElementById("navContact").innerText=dict[l].nav[2];

document.getElementById("title").innerText=dict[l].title;

dict[l].text.forEach((v,i)=>
document.getElementById("p"+(i+1)).innerText=v
);
}

document.querySelectorAll(".lang button")
.forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

setImages();
setLang(localStorage.getItem("lang")||"pl");

</script>

</body>
</html>
