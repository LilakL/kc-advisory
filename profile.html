<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>O mnie | Konrad Czachor Advisory & Partners</title>

<style>
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial}

/* HEADER */

header{
position:sticky;
top:0;
background:#fff;
padding:25px 40px;
display:flex;
justify-content:space-between;
align-items:flex-start;
box-shadow:0 2px 10px rgba(0,0,0,.1);
z-index:10
}

.logo img{
height:140px;
object-fit:contain;
display:block;
}

.right-menu{
display:flex;
flex-direction:column;
align-items:flex-end;
}

nav{margin-bottom:15px}

nav a{
margin-left:25px;
text-decoration:none;
color:#111;
font-weight:600;
font-size:18px;
}

.lang button{
margin-left:8px;
padding:8px 14px;
border:1px solid #ccc;
background:#fff;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.lang button.active{
border-color:#2563eb;
box-shadow:0 0 0 2px #2563eb inset;
}

/* HERO BACKGROUND – TAKIE SAMO JAK INDEX */

.hero{
height:320px;
background:url(img/background.jpg) center/cover;
position:relative;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
}

.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.55);
}

.hero h1{
position:relative;
z-index:2;
font-size:42px;
margin:0;
}

/* CONTENT */

.content{
padding:80px 50px;
background:#f5f5f5;
}

.content-inner{
max-width:900px;
margin:auto;
}

.content p{
font-size:18px;
line-height:1.7;
margin-bottom:20px;
}

footer{
background:#111;
color:#fff;
padding:25px;
text-align:center;
}

@media(max-width:900px){
.logo img{height:90px}
header{flex-direction:column;align-items:center}
.right-menu{align-items:center}
.hero{height:220px}
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="img/logo.png" alt="Konrad Czachor Advisory & Partners">
</div>

<div class="right-menu">
<nav>
<a href="index.html#services" id="navServices"></a>
<a href="profile.html" id="navAbout"></a>
<a href="contact.html" id="navContact"></a>
</nav>

<div class="lang">
<button data-lang="pl">PL</button>
<button data-lang="en">GB</button>
<button data-lang="de">DE</button>
</div>
</div>
</header>

<section class="hero">
<h1 id="title"></h1>
</section>

<section class="content">
<div class="content-inner">
<p id="p1"></p>
<p id="p2"></p>
<p id="p3"></p>
<p id="p4"></p>
</div>
</section>

<footer>© 2026 Konrad Czachor Advisory & Partners</footer>

<script>
const dict={
pl:{
nav:["Usługi","O mnie","Kontakt"],
title:"O mnie",
text:[
"Od ponad 20 lat pracuję w środowisku przemysłowym i międzynarodowym.",
"Łączę doświadczenie operacyjne z praktycznym podejściem do zarządzania zmianą.",
"Specjalizuję się w transformacji operacyjnej, systemach jakości oraz budowaniu silnych struktur zarządczych.",
"Moim celem jest realny rezultat – nie prezentacja, lecz wykonanie."
]
},
en:{
nav:["Services","About me","Contact"],
title:"About me",
text:[
"I have over 20 years of experience in international industrial environments.",
"I combine operational leadership with practical change management.",
"My focus areas include operational transformation, quality systems and executive structures.",
"My objective is measurable impact – execution over theory."
]
},
de:{
nav:["Leistungen","Über mich","Kontakt"],
title:"Über mich",
text:[
"Seit über 20 Jahren arbeite ich im internationalen Industrieumfeld.",
"Ich verbinde operative Führung mit pragmatischem Change-Management.",
"Meine Schwerpunkte sind operative Transformation, Qualitätssysteme und Führungsstrukturen.",
"Mein Ziel ist messbarer Erfolg – Umsetzung statt Theorie."
]
}
};

function setLang(l){
localStorage.setItem("lang",l);
document.querySelectorAll(".lang button").forEach(b=>b.classList.remove("active"));
document.querySelector(`[data-lang=${l}]`).classList.add("active");

navServices.innerText=dict[l].nav[0];
navAbout.innerText=dict[l].nav[1];
navContact.innerText=dict[l].nav[2];

title.innerText=dict[l].title;
dict[l].text.forEach((v,i)=>document.getElementById("p"+(i+1)).innerText=v);
}

document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
setLang(localStorage.getItem("lang")||"pl");
</script>

</body>
</html>
