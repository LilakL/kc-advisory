<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>

<style>
*{box-sizing:border-box;}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
color:#222;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 40px;
background:#ffffff;
flex-wrap:wrap;
}

.logo img{height:120px;}

nav{
display:flex;
align-items:center;
gap:30px;
font-weight:600;
flex-wrap:wrap;
}

nav a{
text-decoration:none;
color:#000;
}

.lang button{
margin-left:10px;
padding:6px 12px;
border-radius:8px;
border:1px solid #ccc;
background:#f0f0f0;
cursor:pointer;
}

.lang button.active{
background:#1d3c6a;
color:#fff;
border:none;
}

.hero{
background:#1d3c6a;
color:#fff;
padding:80px 20px 120px 20px;
text-align:center;
font-size:48px;
font-weight:700;
}

.hero a{
color:#ffffff;
text-decoration:none;
font-size:16px;
opacity:0.85;
display:inline-block;
margin-bottom:20px;
}

.section{
width:100%;
padding:80px 40px;
}

.profile-grid{
display:flex;
gap:60px;
align-items:center;
justify-content:center;
flex-wrap:wrap;
max-width:1400px;
margin:auto;
}

.profile-photo{
width:400px;
max-width:100%;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

.profile-text{
flex:1;
min-width:300px;
font-size:20px;
line-height:1.8;
}

.mm-section{
width:100%;
margin-top:100px;
display:flex;
justify-content:center;
}

.mm-wrapper{
width:100%;
max-width:1200px;
display:flex;
justify-content:center;
}

.mm-wrapper img{
width:100%;
max-width:1100px;
height:auto;
border-radius:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.12);
display:none;
}

.clients{
margin-top:120px;
text-align:center;
}

.clients h2{
margin-bottom:40px;
font-size:28px;
}

.client-logos{
display:flex;
flex-wrap:wrap;
gap:40px;
justify-content:center;
align-items:center;
padding:0 20px;
}

.client-logos img{
height:60px;
opacity:0.85;
transition:0.3s;
}

.client-logos img:hover{
opacity:1;
transform:scale(1.05);
}

@media(max-width:768px){
.section{padding:60px 20px;}
.hero{font-size:32px;}
.profile-text{font-size:18px;}
.client-logos{gap:25px;}
.client-logos img{height:45px;}
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="img/logo.png" alt="Logo">
</div>

<nav>
<a href="index.html" id="nav-services">Usługi</a>
<a href="profile.html" id="nav-about">O mnie</a>
<a href="#" id="nav-contact">Kontakt</a>

<div class="lang">
<button data-lang="pl" class="active">PL</button>
<button data-lang="en">GB</button>
<button data-lang="de">DE</button>
</div>
</nav>
</header>

<div class="hero">
<a href="index.html" id="home-link">← Strona główna</a>
<div id="hero-title">O mnie</div>
</div>

<section class="section">

<div class="profile-grid">
<img src="img/Konrad-Czachor.jpg" alt="Konrad Czachor" class="profile-photo">
<div class="profile-text" id="profile-text"></div>
</div>

<div class="mm-section">
<div class="mm-wrapper">
<img src="Profile_MM_PL.png" id="mm-pl">
<img src="Profile_MM_GB.png" id="mm-en">
<img src="Profile_MM_GER.png" id="mm-de">
</div>
</div>

<div class="clients">
<h2 id="clients-title">Wybrane realizacje / Klienci</h2>

<div class="client-logos">
<img src="img/BMW.png">
<img src="img/KIRCHHOFF_Automotive_Logo.svg.png">
<img src="img/Delphi.png">
<img src="img/Garmin.png">
<img src="img/Magna.jpg">
<img src="img/Nidec.png">
<img src="img/KK windsolutions.png">
<img src="img/OC.png">
<img src="img/alps_electric_logo.jpg">
</div>

</div>

</section>

<script>

const content={
pl:{
title:"O mnie",
clients:"Wybrane realizacje / Klienci",
home:"← Strona główna",
nav:{services:"Usługi",about:"O mnie",contact:"Kontakt"},
text:`
<p>Od ponad 20 lat pracuję w środowisku przemysłowym i międzynarodowym.</p>
<p>Łączę doświadczenie operacyjne z praktycznym podejściem do zarządzania zmianą.</p>
<p>Specjalizuję się w transformacji operacyjnej, systemach jakości oraz budowaniu silnych struktur zarządczych.</p>
<p>Moim celem jest realny rezultat – wykonanie ponad prezentację.</p>`
},
en:{
title:"About me",
clients:"Selected Projects / Clients",
home:"← Home",
nav:{services:"Services",about:"About me",contact:"Contact"},
text:`
<p>I have been working in industrial and international environments for over 20 years.</p>
<p>I combine operational experience with a practical approach to change management.</p>
<p>I specialize in operational transformation, quality systems and building strong management structures.</p>
<p>My goal is real results – execution beyond presentation.</p>`
},
de:{
title:"Über mich",
clients:"Ausgewählte Projekte / Kunden",
home:"← Startseite",
nav:{services:"Leistungen",about:"Über mich",contact:"Kontakt"},
text:`
<p>Seit über 20 Jahren arbeite ich im industriellen und internationalen Umfeld.</p>
<p>Ich verbinde operative Erfahrung mit einem praxisorientierten Ansatz im Veränderungsmanagement.</p>
<p>Ich spezialisiere mich auf operative Transformation, Qualitätssysteme und den Aufbau starker Führungsstrukturen.</p>
<p>Mein Ziel ist ein reales Ergebnis – Umsetzung statt Präsentation.</p>`
}
};

const buttons=document.querySelectorAll(".lang button");
const profileText=document.getElementById("profile-text");
const heroTitle=document.getElementById("hero-title");
const clientsTitle=document.getElementById("clients-title");
const homeLink=document.getElementById("home-link");

const navServices=document.getElementById("nav-services");
const navAbout=document.getElementById("nav-about");
const navContact=document.getElementById("nav-contact");

const images={
pl:document.getElementById("mm-pl"),
en:document.getElementById("mm-en"),
de:document.getElementById("mm-de")
};

function setLang(lang){

heroTitle.innerText=content[lang].title;
clientsTitle.innerText=content[lang].clients;
profileText.innerHTML=content[lang].text;
homeLink.innerText=content[lang].home;

navServices.innerText=content[lang].nav.services;
navAbout.innerText=content[lang].nav.about;
navContact.innerText=content[lang].nav.contact;

Object.values(images).forEach(img=>img.style.display="none");
images[lang].style.display="block";

buttons.forEach(btn=>btn.classList.remove("active"));
document.querySelector(`[data-lang="${lang}"]`).classList.add("active");

localStorage.setItem("lang",lang);
}

buttons.forEach(btn=>{
btn.addEventListener("click",()=>{
setLang(btn.dataset.lang);
});
});

setLang(localStorage.getItem("lang")||"pl");

</script>

</body>
</html>
