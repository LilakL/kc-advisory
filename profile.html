<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Profile | Konrad Czachor</title>

<style>
:root{
--primary:#0f2e4f;
--text:#111827;
--muted:#6b7280;
--bg:#f7f8fa;
--card:#ffffff;
}

body.dark{
--primary:#1e3a5f;
--text:#e5e7eb;
--muted:#9ca3af;
--bg:#0b1220;
--card:#111827;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:40px 60px;
background:var(--card);
}

.logo img{
height:420px;
transition:.3s;
}

nav{
display:flex;
align-items:center;
gap:28px;
}

nav a{
text-decoration:none;
font-size:14px;
color:var(--text);
}

.mode-toggle{
border:none;
background:none;
cursor:pointer;
font-size:13px;
font-weight:600;
color:var(--text);
}

.section{
max-width:900px;
margin:auto;
padding:130px 20px;
}

@media(max-width:768px){
header{padding:20px;}
.logo img{height:180px;}
}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="img/logo.png">
</div>

<nav>
<a href="index.html">← Back</a>
<a href="contact.html">Contact</a>
<button class="mode-toggle" id="modeToggle">Dark</button>
</nav>
</header>

<section class="section">
<h1>Board-Level Operational Leadership</h1>
<p style="margin-top:30px;color:var(--muted);font-size:18px;">
Executive advisor specializing in turnaround and enterprise value protection.
</p>
</section>

<script>
const toggle=document.getElementById("modeToggle");
if(localStorage.getItem("mode")==="dark"){
document.body.classList.add("dark");
toggle.textContent="Light";
}
toggle.addEventListener("click",()=>{
document.body.classList.toggle("dark");
localStorage.setItem("mode",document.body.classList.contains("dark")?"dark":"light");
});
</script>

</body>
</html>
