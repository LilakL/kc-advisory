<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Contact</title>

<style>
:root{
--primary:#0f2e4f;
--text:#111827;
--bg:#f7f8fa;
--card:#ffffff;
--border:#e5e7eb;
}

body.dark{
--primary:#1e3a5f;
--text:#e5e7eb;
--bg:#0b1220;
--card:#111827;
--border:#1f2937;
}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:40px 60px;
background:var(--card);
}

.logo img{
height:420px;
}

nav a{
text-decoration:none;
font-size:14px;
color:var(--text);
}

.section{
max-width:700px;
margin:auto;
padding:140px 20px;
}

input,textarea{
width:100%;
padding:16px;
margin-bottom:20px;
border-radius:10px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
}

button{
padding:16px;
background:var(--primary);
color:#fff;
border:none;
border-radius:30px;
cursor:pointer;
font-weight:600;
}

@media(max-width:768px){
.logo img{height:180px;}
}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="img/logo.png">
</div>
<nav>
<a href="index.html">← Back</a>
</nav>
</header>

<section class="section">

<h1>Executive Contact</h1>

<form action="https://formspree.io/f/mjgeengy" method="POST">
<input type="hidden" name="_subject" value="Confidential Executive Inquiry">
<input type="text" name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email Address" required>
<textarea name="message" placeholder="Brief description of your situation" required></textarea>
<button type="submit">Request Executive Discussion</button>
</form>

</section>

</body>
</html>
