<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Contact | Konrad Czachor</title>

<style>
:root{
--primary:#0f2e4f;
--text:#111827;
--muted:#6b7280;
--bg:#f7f8fa;
--card:#ffffff;
--border:#d1d5db;
}

body.dark{
--primary:#1e3a5f;
--text:#e5e7eb;
--muted:#9ca3af;
--bg:#0b1220;
--card:#111827;
--border:#374151;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
transition:.3s ease;
line-height:1.6;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:24px 60px;
background:var(--card);
border-bottom:1px solid rgba(0,0,0,.05);
}

.logo img{height:56px;}

nav{
display:flex;
align-items:center;
gap:28px;
}

nav a{
text-decoration:none;
font-size:14px;
color:var(--text);
}

.lang button,.mode-toggle{
border:none;
background:none;
cursor:pointer;
font-size:13px;
opacity:.6;
color:var(--text);
}

.lang button.active{
opacity:1;
font-weight:600;
}

.mode-toggle{
opacity:1;
font-weight:600;
}

/* SECTION */

.section{
max-width:700px;
margin:auto;
padding:160px 20px;
text-align:center;
}

.section h1{
font-size:36px;
margin-bottom:25px;
}

.section p{
color:var(--muted);
margin-bottom:60px;
}

form{
display:flex;
flex-direction:column;
gap:25px;
}

input,textarea{
padding:16px;
border-radius:12px;
border:1px solid var(--border);
font-size:16px;
background:var(--card);
color:var(--text);
}

textarea{
min-height:150px;
resize:vertical;
}

button{
padding:16px;
border:none;
background:var(--primary);
color:#fff;
border-radius:40px;
font-size:16px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

/* FADE */

.fade{
opacity:0;
transform:translateY(30px);
transition:all .9s cubic-bezier(.22,1,.36,1);
}

.fade.visible{
opacity:1;
transform:translateY(0);
}

@media(max-width:768px){
header{padding:20px;}
.section h1{font-size:28px;}
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="img/logo.png">
</div>

<nav>
<a href="index.html" data-i18n="nav_back">← Back</a>

<div class="lang">
<button data-lang="pl">PL</button>
<button data-lang="en" class="active">EN</button>
<button data-lang="de">DE</button>
</div>

<button class="mode-toggle" id="modeToggle">Dark</button>
</nav>
</header>

<section class="section fade">

<h1 data-i18n="title">Executive Contact</h1>
<p data-i18n="subtitle">
Confidential discussion regarding turnaround, stabilization or value creation.
</p>

<form action="https://formspree.io/f/mjgeengy" method="POST">

<input type="hidden" name="_subject" value="Confidential Executive Inquiry">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_redirect" value="https://kc-adp.com/thankyou.html">

<input type="text" name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email Address" required>
<input type="text" name="company" placeholder="Company">
<textarea name="message" placeholder="Brief description of your situation" required></textarea>

<button type="submit" data-i18n="btn">Request Executive Discussion</button>

</form>

</section>

<script>

/* Fade */
const observer=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(entry.isIntersecting){entry.target.classList.add("visible");}
});
},{threshold:.15});
document.querySelectorAll(".fade").forEach(el=>observer.observe(el));

/* Dark mode */
const toggle=document.getElementById("modeToggle");
if(localStorage.getItem("mode")==="dark"){
document.body.classList.add("dark");
toggle.textContent="Light";
}
toggle.addEventListener("click",()=>{
document.body.classList.toggle("dark");
if(document.body.classList.contains("dark")){
localStorage.setItem("mode","dark");
toggle.textContent="Light";
}else{
localStorage.setItem("mode","light");
toggle.textContent="Dark";
}
});

/* Translations */

const translations={
pl:{
nav_back:"← Powrót",
title:"Kontakt Executive",
subtitle:"Poufna rozmowa dotycząca stabilizacji, turnaroundu lub wzrostu wartości.",
btn:"Wyślij Zapytanie"
},
de:{
nav_back:"← Zurück",
title:"Executive Kontakt",
subtitle:"Vertrauliches Gespräch zu Turnaround, Stabilisierung oder Wertsteigerung.",
btn:"Anfrage Senden"
}
};

document.querySelectorAll(".lang button").forEach(btn=>{
btn.addEventListener("click",()=>{
document.querySelectorAll(".lang button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
const lang=btn.dataset.lang;
document.querySelectorAll("[data-i18n]").forEach(el=>{
el.textContent=translations[lang][el.dataset.i18n];
});
});
});

</script>

</body>
</html>
